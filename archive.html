<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive - NERV</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <header class="header">
    <div class="container">
      <div class="nav-bar">
        <a href="index.html" class="logo">
          <img src="images/LogoCorporativoPW.png" alt="NERV">
        </a>
        <button class="menu-toggle" aria-label="Menú">
          <span></span><span></span><span></span>
        </button>
        <nav class="nav">
          <a href="index.html">Inicio</a>
          <a href="archive.html" class="active">Archive</a>
          <a href="about.html">NERV</a>
        </nav>
        
        <!-- BUSCADOR POR GÉNERO -->
        <select id="genreSelect" class="search-input">
          <option value="">Todos los géneros</option>
          <option value="28">Acción</option>
          <option value="12">Aventura</option>
          <option value="16">Animación</option>
          <option value="35">Comedia</option>
          <option value="80">Crimen</option>
          <option value="18">Drama</option>
          <option value="10751">Familia</option>
          <option value="14">Fantasía</option>
          <option value="27">Terror</option>
          <option value="9648">Misterio</option>
          <option value="10749">Romance</option>
          <option value="878">Ciencia Ficción</option>
          <option value="53">Thriller</option>
          <option value="10752">Guerra</option>
        </select>
        <a href="login.html" class="btn" id="loginBtn">Iniciar Sesión</a>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 id="archiveTitle" style="font-size:6rem; color:#FF5700; text-align:center; margin:100px 0 60px;">
      Todas las películas
    </h1>
    <div class="archive-grid" id="archiveGrid"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <h1>Nuestras<br>Redes</h1>
      <div class="social-links">
        <a href="#" class="social-icon">Instagram</a>
        <a href="#" class="social-icon">Twitter</a>
        <a href="#" class="social-icon">YouTube</a>
        <a href="#" class="social-icon">TikTok</a>
      </div>
      <p style="margin-top:40px; color:#666; font-size:1rem;">
        © 2025 NERV - Reseñas de cine con alma<br>
        Contacto: nerv.cine@gmail.com
      </p>
    </div>
  </footer>

  <!-- MODAL -->
  <div class="movie-modal" id="movieModal">
    <div class="modal-content">
      <button class="modal-close" id="closeModalBtn">×</button>
      <div class="modal-info">
        <h2 id="modalTitle">Cargando...</h2>
        <p class="year" id="modalYear">2025</p>
        <iframe class="modal-trailer" id="trailerFrame" src="" allowfullscreen></iframe>
        <div class="synopsis" id="modalSynopsis">Cargando sinopsis...</div>
        <div class="stars-rating" id="ratingStars">
          <span data-value="1">★</span>
          <span data-value="2">★</span>
          <span data-value="3">★</span>
          <span data-value="4">★</span>
          <span data-value="5">★</span>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/css/js/main.js"></script>
</body>
</html>
